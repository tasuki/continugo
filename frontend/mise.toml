[tasks.build]
description = "Build the frontend with debugging enabled"
depends = [":_help"]
run = "elm make src/Main.elm --debug --output=public/continugo.js"

[tasks.release]
description = "Build and minify the production frontend"
depends = [":_help"]
run = '''
elm make src/Main.elm --optimize --output=public/continugo.js
uglifyjs public/continugo.js --compress 'pure_funcs=[F2,F3,F4,F5,F6,F7,F8,F9,A2,A3,A4,A5,A6,A7,A8,A9],pure_getters,keep_fargs=false,unsafe_comps,unsafe' \
    | uglifyjs --mangle --output public/continugo.js
'''

[tasks.test]
description = "Run the Elm tests"
depends = [":_help", ":_fixtures"]
run = "elm-test"

[tasks.format]
description = "Format the Elm sources, tests, and benchmarks"
run = "elm-format src tests benchmarks --yes"

[tasks.dev]
description = "Build, watch, and serve at http://localhost:9071"
depends = [":build"]
run = [{ tasks = [":_watch", ":serve"] }]

[tasks.serve]
description = "Serve the built frontend at http://localhost:9071"
run = 'serve public --listen "${PORT:-9071}" --single --no-clipboard --no-port-switching'

[tasks._watch]
hide = true
run = "mise watch :build --watch src --watch elm.json --watch ../docs --exts elm,json,md --postpone --on-busy-update queue"

[tasks._fixtures]
hide = true
run = "node tests/Fixtures/embed.mjs"

[tasks._help]
hide = true
sources = ["../docs/help.md", "mise.toml"]
outputs = ["src/HelpContent.elm"]
run = '''
node <<'JS' > src/HelpContent.elm
const fs = require("node:fs");
const markdown = fs.readFileSync("../docs/help.md", "utf8");
console.log(`module HelpContent exposing (markdown)
markdown = ${JSON.stringify(markdown)}`);
JS
'''
