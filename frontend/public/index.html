<!DOCTYPE html>
<head>
    <title>ContinuGo: freed from the tyranny of the grid</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="description" content="Go, freed from the tyranny of the grid of intersections." />
    <meta name="theme-color" content="#FFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="media/style.css" />
    <link rel="icon" href="media/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
    </script>
    <script src="continugo.js"></script>
</head>
<body>
    <p>If you can see this perhaps you don't have JavaScript enabled?</p>
    <p>Or perhaps I messed something up? No idea, really.</p>
    <p>Bugs to: https://github.com/tasuki/continugo</p>

    <script>
        let saved = null;
        try {
            const stored = JSON.parse(sessionStorage.getItem('continugo.session'));
            // A different incoming URL should load its own game.
            if (stored && stored.url === location.href) saved = stored;
        } catch (_) {}

        var app = Elm.Main.init({ flags: saved });
        app.ports.saveSession.subscribe(function (state) {
            try {
                sessionStorage.setItem('continugo.session', JSON.stringify({ ...state, url: location.href }));
            } catch (_) {}
        });

        async function loadSgf(files) {
            if (files.length !== 1) {
                app.ports.sgfLoadFailed.send('Open or drop one SGF file at a time.');
                return;
            }
            try {
                app.ports.sgfLoaded.send(await files[0].text());
            } catch (_) {
                app.ports.sgfLoadFailed.send('Could not read the SGF file.');
            }
        }

        document.addEventListener('click', function (event) {
            if (document.getElementById('sgf-dropzone')?.contains(event.target)) {
                document.getElementById('sgf-file').click();
            }
        });
        document.addEventListener('change', function (event) {
            if (event.target.id !== 'sgf-file') return;
            if (event.target.files.length) loadSgf(event.target.files);
            event.target.value = '';
        });
        document.addEventListener('dragover', function (event) {
            if (document.getElementById('sgf-dropzone')?.contains(event.target)) {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            }
        });
        document.addEventListener('drop', function (event) {
            if (!document.getElementById('sgf-dropzone')?.contains(event.target)) return;
            event.preventDefault();
            loadSgf(event.dataTransfer.files);
        });
    </script>
</body>
</html>
