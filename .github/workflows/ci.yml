name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    ci:
        runs-on: ubuntu-26.04

        steps:
            - uses: actions/checkout@v7.0.1
            - uses: jdx/mise-action@v5.2.3
              with:
                version: 2026.7.14
            - run: mise run build
            - run: mise run test
